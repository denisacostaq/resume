# This is a basic workflow to help you get started with Actions

name: Deploy cv

# Controls when the action will run. 
on:
  push:
    tags:
    - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install -y pandoc context
          # Generate the ConTeXt resolver database so mtxrun can locate installed scripts
          mtxrun --generate
          # Verify ConTeXt can resolve and run its context script
          mtxrun --script context --version

      # Configure the project to build
      - name: Configure project build
        shell: bash
        run: |
          cmake -S . -B build

      # Runs a single command using the runners shell
      - name: Build CV
        shell: bash
        run: cmake --build build --target pdf doc txt

      - name: Build html version
        shell: bash
        run: |
          cmake -S . -B build -DBUILD_DETAILED_VARIANT=ON
          cmake --build build --target html

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: build/

  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: build

      - name: Get release name
        id: release
        shell: bash
        run: |
          echo "name=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/resume.pdf
            build/resume.txt
            build/resume.docx

      - name: Deploy html version
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          single-commit: true
          branch: gh-pages # The branch the action should deploy to.
          folder: build/www # The folder the action should deploy.

# This is a basic workflow to help you get started with Actions

name: Deploy cv

# Controls when the action will run. 
on:
  push:
    tags:
    - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install -y pandoc context
          # Generate the ConTeXt resolver database so mtxrun can locate installed scripts
          mtxrun --generate
          # Verify ConTeXt can resolve and run its context script
          mtxrun --script context --version

      # Configure the project to build
      - name: Configure project build
        shell: bash
        run: |
          cmake -S . -B build

      # Runs a single command using the runners shell
      - name: Build CV
        shell: bash
        run: cmake --build build --target pdf doc txt

      - name: Build html version
        shell: bash
        run: |
          cmake -S . -B build -DUSE_TECHNICAL_DETAILED=ON
          cmake --build build --target html

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: build

      - name: Extract tag name
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false
          files: |
            build/resume.pdf
            build/resume.txt
            build/resume.docx

      - uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}

      - name: Deploy html version
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          single-commit: true
          branch: gh-pages # The branch the action should deploy to.
          folder: build/www # The folder the action should deploy.

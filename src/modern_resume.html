<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
    <meta charset="utf-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <meta
            name="description"
            content="$if(headline)$$headline$$else$Senior Software Engineer resume$endif$"
    >

    <title>
        $if(title-prefix)$$title-prefix$ — $endif$$title$
    </title>

    $for(css)$
    <link rel="stylesheet" href="$css$">
    $endfor$

    $for(header-includes)$
    $header-includes$
    $endfor$
</head>

<body>

<div class="page-shell">

    <main class="resume">

        <header class="resume-header">

            <div class="identity">

                $if(title)$
                <h1 class="resume-name">$title$</h1>
                $endif$

                $if(headline)$
                <p class="resume-headline">
                    $headline$
                </p>
                $endif$

                $if(contact)$
                <div class="resume-contact">
                    $contact$
                </div>
                $endif$

            </div>

            $if(photo)$
            <div class="portrait-container">
                <img
                        class="portrait"
                        src="$photo$"
                        alt=""
                >
            </div>
            $endif$

        </header>

        <div class="header-rule"></div>

        <article class="resume-content">
            $body$
        </article>

    </main>

</div>

</body>
</html>
